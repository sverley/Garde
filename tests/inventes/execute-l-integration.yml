# Témoin rouge de `rien_de_l_integration_n_est_execute` : le contrôle construit
# ce qu'il juge, et devient un vecteur d'exécution privilégiée.
name: execute
on:
  pull_request_target:
jobs:
  juger:
    runs-on: ubuntu-latest
    steps:
      - name: Référence
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Arbre
        if: github.event.pull_request.draft != true
        uses: actions/checkout@v4
        with:
          ref: refs/pull/1/head
          path: arbre
          persist-credentials: false

      - name: Verdict
        run: cargo build --manifest-path arbre/Cargo.toml
