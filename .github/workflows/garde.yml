name: garde

# Contrôle d'une intégration (§4.4), jugé depuis la référence (§5).
#
# DANGER — `pull_request_target` s'exécute avec un jeton en écriture sur la base.
# Ce workflow ne doit JAMAIS exécuter, sourcer, construire ni installer quoi que
# ce soit venu de l'intégration. Il ne lit que des noms de fichiers et du texte.
# C'est ce qui rend sûr de le lancer depuis un contexte privilégié, et c'est ce
# qui empêche une intégration de désarmer sa propre garde : le fichier de ce
# workflow, le script d'empreinte et la liste d'exclusions sont pris dans la
# base, jamais dans la tête de l'intégration.
#
# Tant que le binaire n'existe pas (§6), ce workflow contrôle la FORME du
# processus, pas le fond : il ne sait pas quelles vérifications manuelles
# devraient être demandées. C'est une dette, portée par un besoin ouvert.
#
# Il ne juge plus lui-même : ce qui se décide vit dans `verdict.sh`, pris dans
# la base, et ce qui se procure reste ici — les deux arbres, l'empreinte, les
# commentaires, le rapport. Une validation n'est due que là où un chemin du
# plancher l'impose (§4.4) ; les chemins viennent de l'arbre du juge, jamais de
# l'arbre jugé (§1).

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: garde-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  garde:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - name: Référence — le contrôle vient de la base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base

      - name: Verdict
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          NUMERO: ${{ github.event.pull_request.number || github.event.issue.number }}
          REFERENCE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # --- L'intégration, telle que la forge la voit -------------------
          gh api "repos/$DEPOT/pulls/$NUMERO" > /tmp/pr.json
          brouillon=$(jq -r '.draft' /tmp/pr.json)
          tete=$(jq -r '.head.sha' /tmp/pr.json)
          porteur=$(jq -r '.user.login' /tmp/pr.json)
          jq -r '.body // ""' /tmp/pr.json > /tmp/corps.txt

          if [ "$brouillon" = "true" ]; then
            echo "Brouillon : rien n'est joué (annexe C)."
            exit 0
          fi

          # --- L'arbre de l'intégration, lu et jamais exécuté --------------
          mkdir arbre && cd arbre
          git init -q
          git remote add origin "https://github.com/$DEPOT.git"
          git -c protocol.version=2 fetch -q --depth=1 origin "refs/pull/$NUMERO/head"
          git checkout -q FETCH_HEAD
          cd ..

          empreinte=$(bash base/.github/scripts/empreinte.sh arbre base/.garde/empreinte-exclusions)
          echo "État validable : $empreinte"

          # --- Les deux arbres (§5) : ce qui a changé ----------------------
          # git quand il répond et aide, le système de fichiers quand il ne
          # répond pas. Aucune API de forge : §4.4 pose des concepts
          # indépendants de la forge et du système de versions.
          liste() {  # liste <répertoire> -> « empreinte chemin », trié par chemin
            if git -C "$1" rev-parse --verify -q HEAD > /dev/null 2>&1; then
              git -C "$1" ls-tree -r --format='%(objectname) %(path)' HEAD
            else
              ( cd "$1" && find . -type f -not -path './.git/*' -exec sha256sum {} + \
                  | sed 's|  \./|  |' | awk '{ h=$1; p=$0; sub(/^[^ ]+  /, "", p); print h " " p }' )
            fi | LC_ALL=C sort -k2
          }
          liste base  > /tmp/avant.txt
          liste arbre > /tmp/apres.txt
          awk '
            { h = $1; p = $0; sub(/^[^ ]+ /, "", p) }
            NR == FNR { avant[p] = h; next }
            { apres[p] = h; if (!(p in avant) || avant[p] != h) print p }
            END { for (p in avant) if (!(p in apres)) print p }
          ' /tmp/avant.txt /tmp/apres.txt | LC_ALL=C sort -u > /tmp/modifications.txt
          echo "Référence retenue : \`$REFERENCE\` — $(wc -l < /tmp/modifications.txt) chemin(s) modifié(s)."

          # --- Le verdict, rendu par la garde et non par le workflow -------
          # Les chemins viennent de l'arbre du juge, jamais de l'arbre jugé
          # (§1, non-intrusion). Le script ne juge que du texte qu'on lui donne.
          set +e
          sortie=$(bash base/.github/scripts/verdict.sh \
            base/docs/chemins.md /tmp/modifications.txt /tmp/corps.txt 2>&1)
          code=$?
          set -e

          refus=()
          due=()
          if [ "$code" -eq 2 ]; then
            refus+=("Le verdict n'a pas pu être rendu : $sortie")
          else
            while IFS= read -r ligne; do
              [ -n "$ligne" ] || continue
              case "$ligne" in
                'validation : '*) due+=("$ligne") ;;
                *) refus+=("$ligne") ;;
              esac
            done <<< "$sortie"
          fi
          demandees=$(grep -c '^### VM-' /tmp/corps.txt || true)

          # --- Validation (§4.4) ------------------------------------------
          # Elle n'est due que là où un chemin l'impose. Seul le porteur valide,
          # et une validation vaut pour l'état validé : elle cite l'empreinte.
          # Une validation posée avant un push ne porte donc pas sur l'état
          # d'après, sans qu'aucune règle ne l'énonce.
          gh api --paginate "repos/$DEPOT/issues/$NUMERO/comments" \
            > /tmp/commentaires.json
          valide=0
          if [ ${#due[@]} -ne 0 ]; then
            valide=$(jq -r --arg p "$porteur" --arg e "$empreinte" '
              [ .[] | select(.user.login == $p)
                    | select(.body | test("(?m)^Validé[[:space:]]*:[[:space:]]*" + $e + "[[:space:]]*$")) ]
              | length' /tmp/commentaires.json)

            if [ "$valide" -eq 0 ]; then
              refus+=("${due[@]}")
              refus+=("Aucune validation du porteur (\`$porteur\`) pour l'état \`$empreinte\`.")
            fi
          fi

          # --- Enregistrement, écrit par le compte de la plateforme --------
          # Support inimitable (§4.4) : aucun contributeur ne peut poster sous
          # ce compte. La garde possédera le format et le verbe ; ici, c'est un
          # échafaudage provisoire.
          {
            echo "<!-- garde -->"
            echo "### Garde"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| État validable | \`$empreinte\` |"
            echo "| Référence retenue | \`$REFERENCE\` |"
            echo "| Tête | \`$tete\` |"
            echo "| Porteur | @$porteur |"
            echo "| Vérifications demandées | $demandees |"
            if [ ${#due[@]} -eq 0 ]; then
              echo "| Validation | non due — aucun chemin modifié ne l'impose |"
            elif [ "$valide" -ne 0 ]; then
              echo "| Validation | due (${#due[@]} chemin(s)), posée |"
            else
              echo "| Validation | due (${#due[@]} chemin(s)), manquante |"
            fi
            if [ ${#refus[@]} -eq 0 ]; then
              echo "| Verdict | **vert** |"
              echo
              if [ ${#due[@]} -eq 0 ]; then
                echo "Aucune vérification ne reste non validée, et rien de ce que cette intégration"
                echo "modifie n'appelle de validation (§4.4, consignes proportionnées)."
              else
                echo "Chaque vérification demandée est analysée, et le porteur a validé cet état."
              fi
            else
              echo "| Verdict | **rouge** |"
              echo
              for r in "${refus[@]}"; do echo "- $r"; done
              if [ ${#due[@]} -ne 0 ] && [ "$valide" -eq 0 ]; then
                echo
                echo "Pour valider, le porteur commente exactement :"
                echo
                echo '```'
                echo "Validé: $empreinte"
                echo '```'
              fi
            fi
            echo
            echo "<sub>Contrôle joué depuis la référence, et les chemins avec lui : rien n'est demandé"
            echo "à l'arbre jugé. Aucun code de l'intégration n'a été exécuté. Tant que le binaire"
            echo "n'existe pas, seule la forme du processus est contrôlée.</sub>"
          } > /tmp/rapport.md

          ancien=$(jq -r '[ .[] | select(.body | startswith("<!-- garde -->")) ] | last | .id // empty' \
            /tmp/commentaires.json)
          if [ -n "$ancien" ]; then
            gh api -X PATCH "repos/$DEPOT/issues/comments/$ancien" -F body=@/tmp/rapport.md > /dev/null
          else
            gh api -X POST "repos/$DEPOT/issues/$NUMERO/comments" -F body=@/tmp/rapport.md > /dev/null
          fi

          if [ ${#refus[@]} -ne 0 ]; then
            printf '%s\n' "${refus[@]}" >&2
            exit 1
          fi
          if [ ${#due[@]} -eq 0 ]; then
            echo "Vert : rien de ce qui est modifié n'appelle de validation."
          else
            echo "Vert : validé pour l'état $empreinte."
          fi
